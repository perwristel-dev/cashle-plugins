dwelling=Välj en bostad som är ställd som säkerhet.
loan=Välj ett lån som är kopplat till bostaden.
duplicate=Lånet har redan en plan för norskt amorteringskrav.
credit=Ett kopplat lån saknar stöd för amortering.
amount=Ange positiva belopp för bankens värdering och beviljat lånebelopp.
date=Ange datum då lånet beviljades som ÅÅÅÅ-MM-DD.
value=Ange bankens värdering om bostaden saknar ett positivt marknadsvärde.
rate=Lånets referensränta måste vara ändlig och icke-negativ.
