dwelling=Choose a dwelling pledged as security.
loan=Choose a loan linked to the dwelling.
duplicate=The loan already has a Norwegian mortgage repayment plan.
credit=A linked loan does not expose its repayable principal.
amount=Enter positive amounts for the lender's valuation and the granted principal.
date=Enter the lender's grant date as YYYY-MM-DD.
value=Enter a lender valuation when the dwelling does not have a positive market value.
rate=The loan's reference interest rate must be finite and nonnegative.
