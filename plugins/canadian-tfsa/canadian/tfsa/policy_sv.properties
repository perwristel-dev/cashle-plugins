Available\ TFSA\ room=Tillgängligt insättningsutrymme på TFSA
Model\ TFSA\ as\ one\ aggregate\ personal\ account\ to\ enforce\ shared\ contribution\ room.=Redovisa TFSA som ett sammanlagt personligt konto för att kontrollera det gemensamma insättningsutrymmet.
TFSA\ deposit\ exceeds\ remaining\ personal\ contribution\ room;\ same-year\ withdrawals\ do\ not\ restore\ room.=TFSA-insättningen överstiger personens kvarvarande utrymme; uttag samma år återställer inte utrymmet.
TFSA\ needs\ consecutive\ full\ resident\ annual\ observations;\ allowance\ year\ must\ be\ current\ or\ previous.=TFSA kräver sammanhängande hela hemvistår; senast tilldelat år måste vara innevarande eller föregående år.
TFSA\ requires\ verified\ available\ contribution\ room,\ including\ room\ used\ in\ every\ other\ TFSA.=TFSA kräver verifierat tillgängligt insättningsutrymme, inklusive utrymme som används på alla andra TFSA.
TFSA\ year\ already\ allocated=Senast tilldelat TFSA-år
Verified\ total\ remaining\ contribution\ room\ at\ start=Verifierat kvarvarande insättningsutrymme vid start
Withdrawals\ restored\ next\ year=Uttag som återställer utrymme nästa år
