coverage=Confirmez que tous les contrats d’assurance-vie et de capitalisation du contribuable sont modélisés et relèvent des primes éligibles postérieures à la réforme, en unités de compte.
opening=Indiquez un premier versement à compter du 27 septembre 2017.
withdrawalDate=Le rachat doit intervenir à compter du premier versement.
close=Un rachat total doit clôturer le contrat.
filing=Ce profil couvre les contribuables imposés seuls qui relèvent du PFU.
externalDistributions=Les revenus des placements du contrat restent investis jusqu’au rachat.
youngGains=Les produits des rachats avant huit ans ne peuvent excéder le total des produits des rachats.
premiums=Rapprochez les primes non remboursées à l’ouverture des versements et rachats de l’année.
