term=Enter a remaining mortgage term of 1 to 360 whole months.
deferral=Enter up to 120 remaining months of agreed interest-only payments.
periods=The mortgage term and interest-only period must align with the loan payment frequency and leave at least one principal installment.
projection=The selected mortgage must supply a valid interest projection and payment calendar.
exclusive=The mortgage can have one active annuity repayment plan.
