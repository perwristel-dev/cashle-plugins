owner=Select an individual owner for the Norwegian occupational pension.
birth=Enter the pension owner's year and month of birth.
start=Enter a valid age, date or milestone for the pension start.
amount=Enter a nonnegative finite pension balance and annual pensionable pay.
rate=Enter a base employer contribution rate between 2 and 7 percent.
additional=Enter a rate between 0 and 18.1 percent for pay between 7.1 G and 12 G.
growth=Enter an annual return between -99 and 100 percent.
term=Enter a whole number of payment years between 1 and 60 and a valid small-balance choice.
