owner=Velg en individuell eier for den norske tjenestepensjonen.
birth=Oppgi pensjonseierens fødselsår og fødselsmåned.
start=Oppgi en gyldig alder, dato eller milepæl for pensjonsuttaket.
amount=Oppgi ikke-negativ pensjonskapital og årlig pensjonsgivende lønn.
rate=Oppgi en grunnsats mellom 2 og 7 prosent.
additional=Oppgi en sats mellom 0 og 18,1 prosent for lønn mellom 7,1 G og 12 G.
growth=Oppgi årlig avkastning mellom −99 og 100 prosent.
term=Oppgi 1 til 60 hele utbetalingsår og velg om liten kapital skal få kortere utbetalingstid.
