owner=Välj en mottagare med känt födelseår och känd födelsemånad.
amount=Ange icke-negativa brutto- och skattepliktiga belopp per fjortondagarsperiod. Skattepliktigt belopp får inte överstiga bruttobeloppet.
rate=Välj ett angivet belopp eller en tillämplig hel pensionsnivå.
eligibility=Bekräfta att prognosen förutsätter att mottagaren uppfyller bosättningskraven och den ekonomiska prövningen för angivet belopp.
start=Välj en giltig ålder, ett datum eller en milstolpe för pensionen.
exempt=skattefritt tillägg
