A\ complete\ PEA\ withdrawal\ closes\ the\ plan\ and\ requires\ explicit\ closeAccount;\ an\ empty\ closed\ plan\ cannot\ be\ reused\ for\ new\ deposits.=Ett fullständigt PEA-uttag avslutar kontot och kräver uttryckligt kontoavslut; ett tomt avslutat konto kan inte återanvändas för nya insättningar.
A\ withdrawal\ before\ five\ years\ must\ fully\ close\ this\ ordinary\ PEA\ profile;\ statutory\ exceptional\ partial\ withdrawals\ are\ unsupported.=Uttag inom fem år måste avsluta hela detta vanliga PEA-konto; särskilda undantag för deluttag stöds inte.
Confirm\ eligible\ listed\ PEA\ assets;\ unlisted\ distributions\ and\ historic\ social-rate\ profiles\ are\ unsupported.=Bekräfta godkända noterade PEA-tillgångar; onoterade utdelningar och historiska avgiftsprofiler stöds inte.
Deposit\ exceeds\ ordinary\ PIR\ annual/lifetime\ or\ PEA\ combined\ contribution\ ceiling.=Insättningen överstiger PIR-kontots års- eller livstidstak, eller det gemensamma taket för PEA.
Existing\ PEA/PEA-PME\ lifetime\ contribution\ counters\ exceed\ ordinary\ statutory\ ceilings.=Historiska livstidsinsättningar på PEA och PEA-PME överstiger de vanliga lagstadgade taken.
External\ contributions\ in\ current\ tax\ year=Externa insättningar under innevarande skatteår
Historical\ contributions\ must\ cover\ remaining\ contributed\ principal\ and\ current-year\ contributions;\ market\ value\ cannot\ substitute\ for\ these\ counters.=Historiska insättningar måste täcka kvarvarande insatt kapital och årets insättningar; marknadsvärdet kan inte ersätta dessa uppgifter.
Lifetime\ contributions\ to\ the\ other\ PEA/PEA-PME=Livstidsinsättningar på det andra PEA- eller PEA-PME-kontot
Lifetime\ external\ contributions,\ never\ reduced\ by\ withdrawals=Externa livstidsinsättningar, utan minskning för uttag
Only\ eligible\ listed\ PEA\ assets,\ no\ unlisted-income\ exception=Endast godkända noterade PEA-tillgångar, utan undantag för onoterade inkomster
PEA\ closure\ at\ a\ loss\ requires\ provider-verified\ liquidation\ and\ statutory\ loss\ eligibility,\ unsupported\ in\ this\ profile.=PEA-avslut med förlust kräver verifierad avveckling och avdragsrätt enligt lag; denna profil stöder inte det.
PEA\ current-year\ early\ gains\ cannot\ exceed\ total\ withdrawal\ gains.=Årets tidiga PEA-vinster kan inte överstiga de totala uttagsvinsterna.
PEA\ requires\ actual\ first-payment\ acquiredDate\ and\ withdrawal\ date.=PEA kräver faktisk första insättningsdag och uttagsdag.
PEA\ withdrawal\ cannot\ precede\ opening.=PEA-uttaget kan inte ske före kontots öppnande.
PEA/PIR\ dividends\ must\ remain\ inside\ the\ wrapper;\ external\ distributions\ require\ a\ dated\ withdrawal\ assessment\ and\ cannot\ be\ treated\ as\ tax-free\ cash.=Utdelningar på PEA och PIR måste stanna på kontot; externa utbetalningar kräver en daterad uttagsbedömning och kan inte betraktas som skattefri kassa.
Pre-2018\ PEA\ historical\ social-rate\ profiles\ require\ provider-specific\ assessment.=Historiska PEA-avgiftsprofiler före 2018 kräver leverantörsspecifik bedömning.
Pre-five-year\ withdrawal\ gains\ in\ current\ year=Uttagsvinster före femårsgränsen under innevarande år
Provide\ actual\ lifetime\ wrapper\ contributions\ covering\ the\ remaining\ contributed\ principal.=Ange faktiska livstidsinsättningar som täcker kvarvarande insatt kapital.
