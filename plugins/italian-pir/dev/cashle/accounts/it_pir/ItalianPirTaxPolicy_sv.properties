A\ provider\ must\ certify\ ordinary\ PIR\ asset\ composition,\ concentration,\ residence\ and\ legal\ eligibility;\ account\ opening\ alone\ proves\ no\ contribution-lot\ holding\ period.=Leverantören måste intyga PIR-kontots tillgångsfördelning, koncentration, hemvist och juridiska villkor; öppningsdagen visar inte innehavstiden för varje insättningspost.
Deposit\ exceeds\ ordinary\ PIR\ annual/lifetime\ or\ PEA\ combined\ contribution\ ceiling.=Insättningen överstiger PIR-kontots års- eller livstidstak, eller det gemensamma taket för PEA.
Early\ PIR\ disposal\ requires\ provider-resolved\ recapture\ tax\ and\ interest;\ opening\ date\ cannot\ establish\ five-year\ holding\ for\ every\ contribution\ lot.=Tidig PIR-försäljning kräver leverantörens fastställda återkrav och ränta; öppningsdagen visar inte fem års innehav för varje insättningspost.
Existing\ PIR\ historical\ contribution\ counters\ exceed\ statutory\ ceilings.=Historiska PIR-insättningar överstiger lagens tak.
External\ contributions\ in\ current\ tax\ year=Externa insättningar under innevarande skatteår
Historical\ contributions\ must\ cover\ remaining\ contributed\ principal\ and\ current-year\ contributions;\ market\ value\ cannot\ substitute\ for\ these\ counters.=Historiska insättningar måste täcka kvarvarande insatt kapital och årets insättningar; marknadsvärdet kan inte ersätta dessa uppgifter.
Lifetime\ external\ contributions,\ never\ reduced\ by\ withdrawals=Externa livstidsinsättningar, utan minskning för uttag
PEA/PIR\ dividends\ must\ remain\ inside\ the\ wrapper;\ external\ distributions\ require\ a\ dated\ withdrawal\ assessment\ and\ cannot\ be\ treated\ as\ tax-free\ cash.=Utdelningar på PEA och PIR måste stanna på kontot; externa utbetalningar kräver en daterad uttagsbedömning och kan inte betraktas som skattefri kassa.
PIR\ withdrawal\ needs\ its\ actual\ date.=PIR-uttaget kräver sin faktiska dag.
Provide\ actual\ lifetime\ wrapper\ contributions\ covering\ the\ remaining\ contributed\ principal.=Ange faktiska livstidsinsättningar som täcker kvarvarande insatt kapital.
Provider\ certifies\ every\ disposed/withdrawn\ contribution\ lot\ held\ five\ years=Leverantören intygar fem års innehav för varje såld eller uttagen insättningspost
Provider\ certifies\ ordinary\ PIR\ legal\ asset/allocation/residence\ requirements=Leverantören intygar PIR-kontots vanliga krav på tillgångar, fördelning och hemvist
Provider-resolved\ PIR\ recapture\ tax\ and\ interest\ for\ current\ year=Leverantörens fastställda PIR-återkrav och ränta för innevarande år
Provider-resolved\ early-disposal\ recapture\ including\ interest,\ nominal\ EUR=Leverantörens fastställda återkrav vid tidig försäljning, inklusive ränta, i nominella EUR
This\ resolved\ PIR\ recapture\ profile\ supports\ a\ single\ full\ early\ closure,\ not\ repeated\ partial\ recaptures.=Denna PIR-profil med fastställt återkrav stöder endast ett fullständigt tidigt avslut, utan upprepade delvisa återkrav.
