Basis\ identification=Identifiering av anskaffningsvärde
Capital\ gains\ require\ acquisition/disposal\ holding-period\ facts.=Kapitalvinster kräver faktiska anskaffnings- och försäljningsdagar för innehavstiden.
Company\ tax\ rate=Bolagsskattesats
Confirm\ one\ identified\ acquisition\ lot,\ no\ added/reinvested\ lots\ and\ no\ wash-sale\ arrangement.=Bekräfta en identifierad anskaffningspost, utan ytterligare eller återinvesterade poster och utan skattearrangemang med återköp.
Declare\ identified-lot\ basis\ or\ provide\ resolved\ disposal\ basis.=Ange identifierad post eller ett fastställt anskaffningsvärde för försäljningen.
Discount-eligible\ gains\ cannot\ exceed\ gross\ realized\ gains.=Vinster som ger rätt till rabatt kan inte överstiga den totala realiserade vinsten.
Dividend\ franked\ fraction=Andel av utdelningen med tillgodoräknad bolagsskatt
Gain\ fiscal\ year=Skatteår för vinsten
Gross\ discount-eligible\ gains\ this\ year=Bruttovinster med rätt till rabatt under året
Invalid\ dividend\ franking\ assumptions.=Antagandena om utdelningens tillgodoräknade bolagsskatt är ogiltiga.
Lot\ acquisition\ date=Anskaffningsdag för posten
One\ identified\ acquisition\ lot=En identifierad anskaffningspost
Provide\ the\ identified\ lot\ acquisition\ date.=Ange den identifierade postens anskaffningsdag.
Resolved\ disposal\ basis\ exceeds\ the\ remaining\ lot\ basis.=Fastställt anskaffningsvärde för försäljningen överstiger postens kvarvarande värde.
