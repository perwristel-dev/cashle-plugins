ownerBirth=Ange ägarens födelseår och födelsemånad.
firstRothYear=Ange skatteåret för första Roth IRA-insättningen, eller noll för ett nytt konto utan insatt kapital.
roomYear=Ange skatteåret då insättningsutrymmet börjar användas.
room=Ange ett ändligt, verifierat insättningsutrymme på minst noll.
excess=Insättningen överskrider återstående utrymme för ordinarie Roth IRA-insättningar.
gainsDate=För att bedöma uttag av avkastning från Roth IRA krävs ett uttagsdatum.
unqualified=Uttaget berör avkastning innan både 59½ år och perioden på fem skatteår har uppnåtts.
aggregate=Använd ett samlat Roth IRA per person.
reinvest=Behåll utdelningar inom Roth IRA och använd ett uttag för utbetalningar.
