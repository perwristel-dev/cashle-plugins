ownerBirth=Enter the owner's birth year and month.
firstRothYear=Enter the first Roth IRA contribution tax year, or zero for an unfunded new account.
roomYear=Enter the starting tax year for the contribution room.
room=Enter finite, nonnegative verified contribution room.
excess=This deposit exceeds the remaining regular Roth IRA contribution room.
gainsDate=A dated withdrawal is required to check Roth IRA earnings.
unqualified=This withdrawal reaches earnings before age 59½ and the five-tax-year period have both passed.
aggregate=Use one combined Roth IRA per person.
reinvest=Keep dividends inside the Roth IRA and use a withdrawal for any distribution.
