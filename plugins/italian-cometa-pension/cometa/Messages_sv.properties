owner=Ange medlemmens födelseår och födelsemånad.
membership=Ange startdatum för sammanhängande kvalificerande tjänstepensionsmedlemskap.
eligibility=Ange datum då medlemmen uppfyller villkoren för den obligatoriska pensionen.
quote=Ange ett icke-negativt prognostiserat kapital och en icke-negativ månadsutbetalning efter fondens skatt.
capital=Bruttokapitalet kan vara högst 50 % av kapitalet enligt beskedet. Nettokapitalet får inte överstiga bruttokapitalet.
annuity=Ange återstående livsvarig pension när ett kapitalbelopp tas ut.
