owner=Inserire anno e mese di nascita dell’aderente.
membership=Inserire la data di inizio della partecipazione continuativa utile alla previdenza complementare.
eligibility=Inserire la data confermata di maturazione dei requisiti della pensione obbligatoria.
quote=Inserire una posizione stimata e una rendita netta mensile maggiori o uguali a zero.
capital=Il capitale lordo può essere al massimo il 50% della posizione. Il capitale netto non può superare quello lordo.
annuity=Inserire la rendita vitalizia residua in caso di liquidazione parziale in capitale.
