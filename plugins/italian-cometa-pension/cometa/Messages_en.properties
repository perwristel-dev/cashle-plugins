owner=Enter the member’s birth year and month.
membership=Enter the start date of continuous qualifying supplementary pension membership.
eligibility=Enter the confirmed date when the member meets mandatory pension requirements.
quote=Enter a nonnegative projected balance and a nonnegative monthly annuity after fund withholding.
capital=Gross capital may be up to 50% of the quoted position. Net capital must not exceed gross capital.
annuity=Enter the remaining lifetime annuity when selecting a capital payment.
