name: Publish plugin ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'build-catalog.mjs'
      - 'plugins/**'
      - '!plugins/*/doc/**'
      - '!plugins/*/test/**'
      - '!plugins/*/README.md'
      - '.github/workflows/publish-plugins.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build plugin catalog
        env:
          PREVIOUS_CATALOG: ${{ steps.pages.outputs.base_url }}/plugins/index.json
        run: node build-catalog.mjs --run-number "$GITHUB_RUN_NUMBER" --previous "$PREVIOUS_CATALOG"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Pages may not list a newly uploaded artifact until the build job finishes.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
