name: DSL calculation tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the DSL runner and plugin cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .cashle-tests/
          key: ${{ runner.os }}-cashle-dsl-${{ hashFiles('scripts/prepare-dsl-tests.mjs', 'plugins/**/plugin.json', 'plugins/**/test/dependencies.json') }}
          restore-keys: |
            ${{ runner.os }}-cashle-dsl-
      - name: Prepare locked dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run test:prepare
      - name: Run calculation tests against the local JVM
        run: npm test
